x-otel-resource-attributes-default: &otel-resource-attributes-default deployment.environment=local,service.namespace=good-vibes

x-otel-exporter-env: &otel-exporter-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # If you override the attributes on a service, include the defaults too; overrides replace, they don't merge.
  OTEL_RESOURCE_ATTRIBUTES: *otel-resource-attributes-default

x-openclaw-agent-env: &openclaw-agent-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  NERVOUS_SYSTEM_API_URL: http://nervous-system-api:8001
  SAFE_DOCKER_URL: http://safe-docker:8080
  NERVOUS_SYSTEM_SAFE_DOCKER_API_KEY: ${NERVOUS_SYSTEM_SAFE_DOCKER_API_KEY}
  <<: *otel-exporter-env
  OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
  TMPDIR: /home/node/.openclaw/tmp

x-openclaw-agent-base: &openclaw-agent-base
  build:
    context: .
    dockerfile: agents/Dockerfile.openclaw
  user: root  # Keep startup ownership fixes simple when overlay mounts are present
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    nervous-system-api:
      condition: service_healthy
  profiles:
    - agent  # Only starts with: docker compose --profile agent up
  restart: unless-stopped

# Agent compose standard in GVS:
# - shared base runtime/env lives in the anchors above
# - per-agent mounts stay explicit because persistence choices are real architecture
# - one example agent ships today, but the shape should extend cleanly to more agents
services:
  # ─── Core Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STATE_DIR:-./state}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - PREFECT_UI_ENABLED=true
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      - PREFECT_SERVER_DATABASE_CONNECTION_POOL_SIZE=10
      - PREFECT_SERVER_DATABASE_CONNECTION_POOL_MAX_OVERFLOW=20
    volumes:
      - prefect-data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── Fetchers ───────────────────────────────────────────────────────────────
  scrapling-fetcher:
    build:
      context: ./second_brain/acquisition/scrapling_fetcher
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    # Playwright/Chromium needs a reasonable memory ceiling
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── API Layer ──────────────────────────────────────────────────────────────
  nervous-system-api:
    build:
      context: .
      dockerfile: nervous_system/Dockerfile.api
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREFECT_API_URL: http://prefect-server:4200/api
      SCRAPLING_FETCHER_URL: ${SCRAPLING_FETCHER_URL:-http://scrapling-fetcher:8002}
      SECOND_BRAIN_LLM_PROVIDER: ${SECOND_BRAIN_LLM_PROVIDER:-ollama}
      SECOND_BRAIN_LLM_MODEL: ${SECOND_BRAIN_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      INGEST_DOMAIN_ALLOWLIST: ${INGEST_DOMAIN_ALLOWLIST}
      SAFE_DOCKER_URL: ${SAFE_DOCKER_URL:-http://safe-docker:8080}
      NERVOUS_SYSTEM_API_KEY: ${NERVOUS_SYSTEM_API_KEY}
      DO_NOT_TRACK: 1
      <<: *otel-exporter-env
      OTEL_SERVICE_NAME: nervous-system-api
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Prefect Worker ─────────────────────────────────────────────────────────
  prefect-worker:
    build:
      context: .
      dockerfile: orchestration/Dockerfile.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREFECT_API_URL: http://prefect-server:4200/api
      SCRAPLING_FETCHER_URL: ${SCRAPLING_FETCHER_URL:-http://scrapling-fetcher:8002}
      SECOND_BRAIN_LLM_PROVIDER: ${SECOND_BRAIN_LLM_PROVIDER:-ollama}
      SECOND_BRAIN_LLM_MODEL: ${SECOND_BRAIN_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      INGEST_DOMAIN_ALLOWLIST: ${INGEST_DOMAIN_ALLOWLIST}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-backups}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres/}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PIP_CACHE_DIR: /root/.cache/pip
      DO_NOT_TRACK: 1
      PREFECT_FLOW_RUN_EXECUTE_SIGTERM_BEHAVIOR: reschedule
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-default-pool}
      PREFECT_WORKER_NAME: ${PREFECT_WORKER_NAME:-good-vibes-worker}
      PREFECT_SHUTDOWN_POLICY: ${PREFECT_SHUTDOWN_POLICY:-reschedule}
      WORKER_DRAIN_GRACE: ${WORKER_DRAIN_GRACE:-30}
      <<: *otel-exporter-env
      OTEL_SERVICE_NAME: prefect-worker
      PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY: true
    volumes:
      - prefect-storage:/prefect-storage
      - pip-cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      scrapling-fetcher:
        condition: service_healthy
    restart: unless-stopped

  # ─── OpenClaw Agent ─────────────────────────────────────────────────────────
  # Agent filesystem contract in this repo:
  # 1. broad runtime substrate lives in the `openclaw-runtime` named volume
  # 2. human-edited workspace files live in `./agents/example`
  # 3. explicit handoff artifacts live in `./shared-workspace`
  # 4. repo root is mounted separately at `/workspace` for broader project access
  # Keep this split boring and explicit. If humans edit it often, bind mount it.
  # If OpenClaw owns it operationally, keep it in the named volume.
  #
  # To enable: set TELEGRAM_BOT_TOKEN in agents/example/config/.env and start with:
  #   docker compose --profile agent up -d example-agent
  example-agent:
    <<: *openclaw-agent-base
    ports:
      - "127.0.0.1:18789:18789"
    env_file:
      - ./.env
      - ./agents/example/config/.env
    volumes:
      # Standard agent layout:
      # 1. Named runtime volume at /home/node/.openclaw
      # 2. Explicit durable submounts (workspace/media/agents/memory/tmp)
      # 3. Shared-workspace bind for handoff artifacts
      # 4. Read-only config/persona overlays into the runtime workspace
      # 5. Broader project tree mounted separately at /workspace
      - openclaw-runtime:/home/node/.openclaw
      - ${HOST_PROJECT_PATH}/agents/example/openclaw-data/workspace:/home/node/.openclaw/workspace
      - ${HOST_PROJECT_PATH}/agents/example/openclaw-data/media:/home/node/.openclaw/media
      - ${HOST_PROJECT_PATH}/agents/example/openclaw-data/agents:/home/node/.openclaw/agents
      - ${HOST_PROJECT_PATH}/agents/example/openclaw-data/memory:/home/node/.openclaw/memory
      - ${HOST_PROJECT_PATH}/agents/example/openclaw-data/tmp:/home/node/.openclaw/tmp
      - ${HOST_PROJECT_PATH}/shared-workspace:/home/node/.openclaw/workspace/shared-workspace:rw
      - ${HOST_PROJECT_PATH}/agents/example/config/openclaw.json:/etc/openclaw/openclaw.json:ro
      - ${HOST_PROJECT_PATH}/agents/example/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro
      - ${HOST_PROJECT_PATH}/agents/example/SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ${HOST_PROJECT_PATH}/agents/example/IDENTITY.md:/home/node/.openclaw/workspace/IDENTITY.md:ro
      - ${HOST_PROJECT_PATH}/agents/example/TOOLS.md:/home/node/.openclaw/workspace/TOOLS.md:ro
      - ${HOST_PROJECT_PATH}/agents/example/USER.md:/home/node/.openclaw/workspace/USER.md:ro
      - ${HOST_PROJECT_PATH}/agents/example/HEARTBEAT.md:/home/node/.openclaw/workspace/HEARTBEAT.md:ro
      - ${HOST_PROJECT_PATH}:/workspace:rw
    environment:
      <<: *openclaw-agent-env
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openai-codex/gpt-5.4}
      OTEL_SERVICE_NAME: example-agent

  # ─── Control Plane ──────────────────────────────────────────────────────────
  safe-docker:
    image: ghcr.io/reptilianhq/safe-docker:0.4.0
    user: root  # Required to access Docker socket on macOS
    ports:
      - "127.0.0.1:8004:8080"
    working_dir: ${HOST_PROJECT_PATH}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirror the repo at its real host path so compose reads/writes share one path universe.
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}:ro
      - ./control/policy.yaml:/app/policy.yaml:ro
    environment:
      - SAFE_DOCKER_AUTH_SECRET=${SAFE_DOCKER_AUTH_SECRET}
      - APPROVAL_WEBHOOK_URL=${APPROVAL_WEBHOOK_URL}
      - DOCKER_CONFIG=/tmp/.docker
      - PWD=${HOST_PROJECT_PATH}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Observability ──────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:3200:3200"   # Tempo HTTP API (Grafana datasource)
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nervous-system-api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

volumes:
  prefect-data:
  prefect-storage:
  tempo-data:
  grafana-data:
  caddy-data:
  caddy-config:
  pip-cache:
  openclaw-runtime:
