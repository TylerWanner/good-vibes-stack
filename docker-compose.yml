services:
  # ─── Core Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STATE_DIR:-./state}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - PREFECT_UI_ENABLED=true
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      - PREFECT_SERVER_DATABASE_CONNECTION_POOL_SIZE=10
      - PREFECT_SERVER_DATABASE_CONNECTION_POOL_MAX_OVERFLOW=20
    volumes:
      - prefect-data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── Fetchers ───────────────────────────────────────────────────────────────
  scrapling-fetcher:
    build:
      context: ./second_brain/acquisition/scrapling_fetcher
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    # Playwright/Chromium needs a reasonable memory ceiling
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── API Layer ──────────────────────────────────────────────────────────────
  nervous-system-api:
    build:
      context: .
      dockerfile: nervous_system/Dockerfile.api
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - SCRAPLING_FETCHER_URL=${SCRAPLING_FETCHER_URL:-http://scrapling-fetcher:8002}
      - SECOND_BRAIN_LLM_PROVIDER=${SECOND_BRAIN_LLM_PROVIDER:-ollama}
      - SECOND_BRAIN_LLM_MODEL=${SECOND_BRAIN_LLM_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - INGEST_DOMAIN_ALLOWLIST=${INGEST_DOMAIN_ALLOWLIST}
      - SAFE_DOCKER_URL=${SAFE_DOCKER_URL:-http://safe-docker:8080}
      - NERVOUS_SYSTEM_API_KEY=${NERVOUS_SYSTEM_API_KEY}
      - DO_NOT_TRACK=1
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=nervous-system-api
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.namespace=good-vibes
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Prefect Worker ─────────────────────────────────────────────────────────
  prefect-worker:
    build:
      context: .
      dockerfile: orchestration/Dockerfile.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - SCRAPLING_FETCHER_URL=${SCRAPLING_FETCHER_URL:-http://scrapling-fetcher:8002}
      - SECOND_BRAIN_LLM_PROVIDER=${SECOND_BRAIN_LLM_PROVIDER:-ollama}
      - SECOND_BRAIN_LLM_MODEL=${SECOND_BRAIN_LLM_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - INGEST_DOMAIN_ALLOWLIST=${INGEST_DOMAIN_ALLOWLIST}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-backups}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-postgres/}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PIP_CACHE_DIR=/root/.cache/pip
      - DO_NOT_TRACK=1
      - PREFECT_FLOW_RUN_EXECUTE_SIGTERM_BEHAVIOR=reschedule
      - PREFECT_WORK_POOL=${PREFECT_WORK_POOL:-default-pool}
      - PREFECT_WORKER_NAME=${PREFECT_WORKER_NAME:-good-vibes-worker}
      - PREFECT_SHUTDOWN_POLICY=${PREFECT_SHUTDOWN_POLICY:-reschedule}
      - WORKER_DRAIN_GRACE=${WORKER_DRAIN_GRACE:-30}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=prefect-worker
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.namespace=good-vibes
      - PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY=true
    volumes:
      - prefect-storage:/prefect-storage
      - pip-cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      scrapling-fetcher:
        condition: service_healthy
    restart: unless-stopped

  # ─── OpenClaw Agent ─────────────────────────────────────────────────────────
  # To enable: set TELEGRAM_BOT_TOKEN in agents/example/config/.env and start with:
  #   docker compose --profile agent up -d openclaw-agent
  openclaw-agent:
    build:
      context: .
      dockerfile: agents/Dockerfile.openclaw
    user: root  # Keep startup ownership fixes simple when overlay mounts are present
    ports:
      - "127.0.0.1:18789:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
      - ./agents/example/config/.env
    volumes:
      # Broad runtime substrate: durable, runtime-owned state.
      - openclaw-runtime:/home/node/.openclaw
      # Human-managed overlays: editable workspace + explicit shared handoff path.
      - ./agents/example:/home/node/.openclaw/workspace:ro
      - ./shared-workspace:/home/node/.openclaw/workspace/shared-workspace
      - ./agents/example/config/openclaw.json:/etc/openclaw/openclaw.json:ro
      - ./:/workspace:rw
    environment:
      - OPENCLAW_CONFIG_PATH=/etc/openclaw/openclaw.json
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-openai-codex/gpt-5.4}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NERVOUS_SYSTEM_API_URL=http://nervous-system-api:8001
      - SAFE_DOCKER_URL=http://safe-docker:8080
      - SAFE_DOCKER_API_KEY=${SAFE_DOCKER_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=openclaw-agent
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.namespace=good-vibes
    depends_on:
      nervous-system-api:
        condition: service_healthy
    profiles:
      - agent  # Only starts with: docker compose --profile agent up
    restart: unless-stopped

  # ─── Control Plane ──────────────────────────────────────────────────────────
  safe-docker:
    image: ghcr.io/reptilianhq/safe-docker:0.2.1
    user: root  # Required to access Docker socket on macOS
    ports:
      - "127.0.0.1:8004:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose-backed writes from inside the control-plane container need the
      # managed project mounted at the same absolute path the host uses.
      - ${PWD}:${PWD}
      - ./control/policy.yaml:/app/policy.yaml:ro
    environment:
      - SAFE_DOCKER_API_KEY=${SAFE_DOCKER_API_KEY}
    command: ["/app/safe-docker", "-config", "/app/policy.yaml"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Observability ──────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:3200:3200"   # Tempo HTTP API (Grafana datasource)
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nervous-system-api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

volumes:
  prefect-data:
  prefect-storage:
  tempo-data:
  grafana-data:
  caddy-data:
  caddy-config:
  pip-cache:
  openclaw-runtime:
