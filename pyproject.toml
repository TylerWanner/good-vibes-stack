[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "Step 1 Second Brain flows and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "python-multipart>=0.0.9",
  "fastmcp>=2.0.0",
  "prefect>=3.0.0",
  "psycopg[binary]>=3.2.0",
  "psycopg2-binary>=2.9.0",
  "python-dateutil>=2.9.0",
  "requests>=2.32.0",

  "boto3>=1.34.0",
  "uvicorn>=0.30.0",
  "yt-dlp>=2024.0.0",
  "alembic>=1.13.0",
  "sqlalchemy>=2.0.0",
  "pgvector>=0.3.0",
  "anthropic>=0.28.0",
  # OpenTelemetry
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-distro>=0.45b0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-requests>=0.45b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
  # Rate limiting
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-env>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
  "DATABASE_URL=postgresql://test:test@localhost:5432/test_db",
]

[project.scripts]
second-brain-mcp = "mcp.server:main"
nervous-system-api = "nervous_system.http.server:main"
second-brain-ingest = "orchestration.flows.ingest_url:main"
second-brain-weekly-digest = "orchestration.flows.weekly_digest:main"
second-brain-post-tweet = "orchestration.flows.post_tweet:main"
second-brain-medicine-reminder = "orchestration.flows.medicine_reminder:main"
second-brain-research = "orchestration.flows.research:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in default arguments (common in FastAPI)
]

[tool.ruff.lint.isort]
known-first-party = [
  "data", "nervous_system", "orchestration", "integrations",
  "shared", "agents", "control", "mcp",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "orchestration*",
  "second_brain*",
  "data*",
  "nervous_system*",
  "integrations*",
  "shared*",
  "agents*",
  "control*",
  "mcp*",
]
