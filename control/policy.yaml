server:
  listen_addr: ":8080"

docker:
  socket_path: "/var/run/docker.sock"
  timeout_seconds: 600
  log_tail_default: 100
  log_tail_max: 500

auth:
  authorized_callers:
    - nervous-system
    - default
  token_secret_env: SAFE_DOCKER_AUTH_SECRET

logging:
  level: info
  format: json

approval:
  webhook_url: "${APPROVAL_WEBHOOK_URL}"
  token_ttl_seconds: 120
  token_ttl_max_seconds: 600

# ---------------------------------------------------------------------------
# Project policies
#
# Project key must match Docker Compose project name.
# Update "good-vibes-stack" if your docker-compose project has a different name.
#
# If you run safe-docker inside Docker and allow compose-backed writes like
# build/recreate, mount the managed project root at the same absolute host path
# inside the container (for example `${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}`).
# Synthetic aliases like `/project` are a footgun for compose mutations.
# ---------------------------------------------------------------------------

projects:
  good-vibes-stack:
    compose_file: ${HOST_PROJECT_PATH}/docker-compose.yml
    services:
      # Core infrastructure - read only
      postgres:
        actions: [status, logs]  # No restart — risk of data corruption

      prefect-server:
        actions: [status, logs, restart]

      prefect-worker:
        actions: [status, logs, restart, build, recreate]
        dangerous: true  # build/recreate require HITL approval; up/down should still be run from host terminal

      # Fetchers
      scrapling-fetcher:
        actions: [status, logs, restart]

      # API layer
      nervous-system-api:
        actions: [status, logs, restart, build, recreate]
        dangerous: true

      # Observability
      tempo:
        actions: [status, logs, restart]

      grafana:
        actions: [status, logs, restart]

      # safe-docker itself - logs only, no self-restart
      safe-docker:
        actions: [status, logs]
